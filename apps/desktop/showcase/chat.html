<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Agent chat (scripted test client)</title>
<style>
:root{--ink:#1f1d1a;--muted:#6b665e;--line:#e6e1d8;--bg:#faf8f4;--accent:#8a5cf6;--tool:#f1eefb}
*{box-sizing:border-box}
body{margin:0;font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;color:var(--ink);background:var(--bg);display:flex;height:100vh}
aside{width:250px;border-right:1px solid var(--line);padding:18px;background:#f3f0ea;display:flex;flex-direction:column;gap:12px}
aside h1{font-size:16px;margin:0}
aside .note{font-size:12px;color:var(--muted)}
.connector{background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px;font-size:13px}
.connector .dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#bbb;margin-right:6px}
.connector.on .dot{background:#2bb673}
.connector ul{margin:6px 0 0;padding-left:16px;color:var(--muted);font-size:12px}
button{font:inherit;border-radius:8px;border:1px solid var(--line);background:#fff;padding:7px 12px;cursor:pointer}
button.primary{background:var(--ink);color:#fff;border-color:var(--ink)}
main{flex:1;display:flex;flex-direction:column;min-width:0}
#log{flex:1;overflow:auto;padding:24px 32px;display:flex;flex-direction:column;gap:14px}
.msg{max-width:720px}
.msg.user{align-self:flex-end;background:#ece6dc;border-radius:16px;padding:10px 14px}
.msg.assistant{align-self:flex-start}
.msg.assistant .who{font-weight:700;font-size:13px;color:var(--accent)}
.tool{align-self:flex-start;background:var(--tool);border:1px solid #ddd5f5;border-radius:10px;padding:8px 12px;font-size:13px;max-width:720px}
.tool .name{font-family:ui-monospace,Menlo,monospace;font-weight:600}
.tool .args{font-family:ui-monospace,Menlo,monospace;color:var(--muted)}
.tool .result{margin-top:4px;white-space:pre-wrap}
.tool.wait{background:#fff6dc;border-color:#f1dfa6}
.tool.error{background:#fde8e6;border-color:#f3c1bb}
.system{align-self:center;color:var(--muted);font-size:13px}
.composer{border-top:1px solid var(--line);padding:14px 32px;display:flex;gap:10px}
.composer textarea{flex:1;resize:none;height:44px;border:1px solid var(--line);border-radius:12px;padding:10px 12px;font:inherit}
dialog{border:1px solid var(--line);border-radius:14px;padding:20px;width:560px}
dialog textarea{width:100%;height:170px;font:12px ui-monospace,Menlo,monospace;border:1px solid var(--line);border-radius:8px;padding:8px}
.typing::after{content:"▍";animation:blink 1s steps(1) infinite}@keyframes blink{50%{opacity:0}}
</style>
</head>
<body>
<aside>
  <h1>💬 Agent chat</h1>
  <div class="note">A scripted stand-in for a Claude chat app. It speaks real MCP to Valet; only the replies are canned.</div>
  <button type="button" id="add-connector">Add MCP server…</button>
  <div id="connectors"></div>
</aside>
<main>
  <div id="log"></div>
  <div class="composer"><textarea id="input" placeholder="Message the agent…"></textarea><button type="button" class="primary" id="send">Send</button></div>
</main>
<dialog id="connector-dialog">
  <h2 style="margin-top:0">Add an MCP server</h2>
  <p style="color:var(--muted);font-size:13px">Paste the server config, in the same <code>mcpServers</code> JSON a desktop chat app takes.</p>
  <textarea id="connector-json" spellcheck="false"></textarea>
  <p style="text-align:right;margin-bottom:0"><button type="button" id="connector-cancel">Cancel</button> <button type="button" class="primary" id="connector-save">Connect</button></p>
</dialog>
<script>
const log = document.getElementById('log')
const scroll = () => { log.scrollTop = log.scrollHeight }
function el(tag, cls, text) { const e = document.createElement(tag); if (cls) e.className = cls; if (text !== undefined) e.textContent = text; return e }
window.chat = {
  user(text) { log.append(el('div', 'msg user', text)); scroll() },
  assistant(text) { const m = el('div', 'msg assistant'); m.append(el('div', 'who', 'Agent'), el('div', '', text)); log.append(m); scroll() },
  system(text) { log.append(el('div', 'system', text)); scroll() },
  tool(name, args) {
    const card = el('div', 'tool')
    const head = el('div'); head.append(el('span', 'name', `⚙ ${name}`), el('span', 'args', ` ${JSON.stringify(args)}`))
    const result = el('div', 'result typing', 'calling Valet…')
    card.append(head, result); log.append(card); scroll()
    card.dataset.id = String(log.children.length - 1)
    return card.dataset.id
  },
  toolResult(id, text, kind) {
    const card = log.children[Number(id)]
    const result = card.querySelector('.result')
    result.classList.remove('typing'); result.textContent = text
    card.classList.remove('wait', 'error'); if (kind) card.classList.add(kind); scroll()
  },
  connector(name, tools) {
    const box = el('div', 'connector on')
    box.append(el('span', 'dot'), el('strong', '', name), el('div', '', `${tools.length} tools`))
    const list = el('ul'); for (const t of tools) list.append(el('li', '', t)); box.append(list)
    document.getElementById('connectors').append(box)
  },
}
const dialog = document.getElementById('connector-dialog')
document.getElementById('add-connector').onclick = () => dialog.showModal()
document.getElementById('connector-cancel').onclick = () => dialog.close()
document.getElementById('connector-save').onclick = () => { window.pendingConnector = document.getElementById('connector-json').value; dialog.close() }
document.getElementById('send').onclick = () => { const i = document.getElementById('input'); window.pendingMessage = i.value; i.value = '' }
</script>
</body>
</html>
