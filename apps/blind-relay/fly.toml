# The blind relay on Fly (docs/blind-relay.md, "Running it"). Raw TCP on 443: Fly passes the
# bytes through untouched (no `handlers`), which needs a dedicated IPv4 address on the app.
app = "valet-relay"
primary_region = "syd"
kill_signal = "SIGTERM"
kill_timeout = 30

[build]
  dockerfile = "Dockerfile"

[env]
  RELAY_CONTROL_HOST = "relay.valet.dncr.me"
  RELAY_MAC_DOMAIN = "valet.dncr.me"
  RELAY_PORT = "8443"
  RELAY_DATA = "/data"

[mounts]
  source = "relay_data"
  destination = "/data"

[[services]]
  protocol = "tcp"
  internal_port = 8443
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[services.ports]]
    port = 443

  [services.concurrency]
    type = "connections"
    hard_limit = 5000
    soft_limit = 4000

  [[services.tcp_checks]]
    interval = "15s"
    timeout = "2s"
    grace_period = "10s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
