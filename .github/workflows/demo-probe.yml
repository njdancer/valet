name: demo probe (temporary)

on:
  push:
    branches: [claude/project-thread-av8z4y]
    paths: [.github/workflows/demo-probe.yml]

permissions:
  contents: write

jobs:
  probe:
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - name: environment
        run: |
          sw_vers; uname -m; whoami; csrutil status || true
          system_profiler SPDisplaysDataType | sed -n 1,40p
          which ffmpeg cliclick || true
          sudo sqlite3 "/Library/Application Support/com.apple.TCC/TCC.db" "select service, client, auth_value from access" | head -80 || true
      - name: install ffmpeg if missing
        run: which ffmpeg || brew install ffmpeg
      - name: list avfoundation devices
        run: ffmpeg -hide_banner -f avfoundation -list_devices true -i "" 2>&1 | tail -20 || true
      - name: record with ffmpeg
        run: |
          system_profiler SPDisplaysDataType | grep -i resolution || true
          mkdir -p out
          ffmpeg -hide_banner -y -f avfoundation -framerate 15 -capture_cursor 1 -i "Capture screen 0:none" -t 12 -pix_fmt yuv420p out/ffmpeg.mp4 > out/ffmpeg.log 2>&1 &
          sleep 2
          open -a TextEdit; sleep 3
          open -a Safari https://example.com || true
          sleep 9; wait || true
          tail -20 out/ffmpeg.log; ls -la out
      - name: record with screencapture
        run: |
          screencapture -v -V 6 -x out/screencapture.mov || echo "screencapture failed: $?"
          ls -la out
      - name: still screenshot
        run: screencapture -x out/still.png; ls -la out
      - name: push the recordings to a branch the thread can fetch
        run: |
          cd out && git init -q -b demo-recordings && git add -A
          git -c user.name=ci -c user.email=ci@example.invalid commit -qm "probe ${{ github.run_id }}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" HEAD:refs/heads/demo-recordings/probe
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: probe
          path: out/
          retention-days: 3
