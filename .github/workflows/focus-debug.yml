# TEMPORARY: reproduces the browser-electron focus flake on macOS. Not for merge.
name: focus-debug
on:
  push:
    branches: [claude/project-thread-n0p920]
jobs:
  stress:
    runs-on: macos-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [a, b]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: jdx/mise-action@c37c93293d6b742fc901e1406b8f764f6fb19dac # v2.4.4
      - run: pnpm install --frozen-lockfile
      - name: whole browser-electron suite, repeatedly
        env:
          E2E_FOCUS_TRACE: '1'
        run: |
          cd packages/browser-electron
          fails=0
          for i in $(seq 1 14); do
            echo "=== round $i"
            pnpm exec playwright test -c e2e/playwright.config.ts --trace off --reporter line > round.log 2>&1 || { fails=$((fails+1)); cat round.log; }
            grep -E "passed|failed" round.log | tail -3
          done
          echo "ROUNDS FAILED: $fails"
