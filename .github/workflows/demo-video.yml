name: Demo video

# Records the install-to-order demo on a fresh macOS runner: Valet Demo (a showcase build, demo mode
# always: apps/desktop/src/main/core/showcase.ts) installed from its DMG, first-run setup, a scripted
# chat client over MCP through the app's own bridge, and the order placed on the fake shop. Nothing
# real is reached: the shop is fakes/woolworths-site in the app's own process, with a test account.
# See apps/desktop/showcase/record.mjs.
#
# The video, its captions, stills and findings go to the run's artifact and to the branch
# demo-recordings/<run id>, so a cloud session (which can't download artifacts) can fetch them.

on:
  workflow_dispatch:
  push:
    branches: [claude/project-thread-av8z4y]

permissions:
  contents: write

concurrency:
  group: demo-video-${{ github.ref }}
  cancel-in-progress: true

jobs:
  record:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: jdx/mise-action@c37c93293d6b742fc901e1406b8f764f6fb19dac # v2.4.4
      - run: pnpm install --frozen-lockfile
      - name: the stdio bridge, which the app ships
        run: swift build -c release --arch arm64 --arch x86_64 --package-path swift-bridge
      - name: package Valet Demo as a DMG
        run: pnpm --filter @valet/desktop package:showcase
      - name: ffmpeg, to record the screen
        run: brew install ffmpeg
      - name: record
        working-directory: apps/desktop
        run: |
          dmg="$(ls dist/showcase/*.dmg | head -1)"
          node showcase/record.mjs --dmg "$dmg" --out "$RUNNER_TEMP/showcase"
      - name: captions into the video
        if: always()
        working-directory: apps/desktop
        run: node showcase/finish.mjs --out "$RUNNER_TEMP/showcase"
      - name: collect the app's diagnostics log
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/showcase/app-logs"
          cp -R "$HOME/Library/Application Support/valet-demo/"*.log "$RUNNER_TEMP/showcase/app-logs/" 2>/dev/null || true
          find "$HOME/Library/Application Support/valet-demo" -maxdepth 2 -name '*log*' | head -20
      - name: push the recording to a branch
        if: always()
        working-directory: ${{ runner.temp }}/showcase
        run: |
          rm -f raw.mkv
          rm -rf captions
          git init -q -b recording && git add -A
          git -c user.name=demo-video -c user.email=demo-video@users.noreply.github.com commit -qm "Demo video, run ${{ github.run_id }}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" HEAD:refs/heads/demo-recordings/${{ github.run_id }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: demo-video
          path: ${{ runner.temp }}/showcase/
          retention-days: 30
