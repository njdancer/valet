name: tls probe
on:
  push:
    branches: [claude/tls-probe]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: probe
        run: |
          set +e
          H=34d3475801fae38f59e75ff4.valet.dncr.me
          pip install -q httpx >/dev/null 2>&1
          python3 - <<'PY'
          import httpx, socket, ssl
          H="34d3475801fae38f59e75ff4.valet.dncr.me"
          U=f"https://{H}/mcp"
          body={"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"p","version":"1"}}}
          def show(label, r):
            print(label, r.status_code, r.reason_phrase, dict(r.headers), repr(r.content[:200]))
          with httpx.Client(timeout=15) as c:
            show("POST default", c.post(U, json=body))
            show("GET default", c.get(U))
            show("GET root", c.get(f"https://{H}/"))
          # raw sockets with exact header sets
          def raw(label, req, split_body=None):
            ctx=ssl.create_default_context(); ctx.set_alpn_protocols(["http/1.1"])
            s=ctx.wrap_socket(socket.create_connection((H,443),timeout=15), server_hostname=H)
            s.sendall(req)
            if split_body: s.sendall(split_body)
            out=b""
            try:
              while True:
                d=s.recv(65536)
                if not d: break
                out+=d
            except Exception as e: out+=f"<{e}>".encode()
            print(label, repr(out[:300]))
          base=f"GET /mcp HTTP/1.1\r\nHost: {H}\r\n"
          raw("raw minimal", (base+"Connection: close\r\n\r\n").encode())
          raw("raw httpx-like", (base+"Accept: */*\r\nAccept-Encoding: gzip, deflate\r\nConnection: keep-alive\r\nUser-Agent: python-httpx/0.28.1\r\n\r\n").encode())
          raw("raw keepalive only", (base+"Connection: keep-alive\r\n\r\n").encode())
          raw("raw no connection hdr", (base+"Accept: */*\r\n\r\n").encode())
          PY
