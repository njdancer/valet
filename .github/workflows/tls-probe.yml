name: tls probe
on:
  push:
    branches: [claude/tls-probe]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - run: node .github/scripts/connector-check.mjs 34d3475801fae38f59e75ff4.valet.dncr.me 3 || true
