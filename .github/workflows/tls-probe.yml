name: tls probe
on:
  push:
    branches: [claude/tls-probe]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: dns
        run: |
          set +e
          for H in bc3fa5306fef06686c8ed4281e245667.valet.dncr.me probe.valet.dncr.me relay.valet.dncr.me; do
            echo "=================== $H"
            for t in A AAAA CNAME HTTPS TXT; do echo "-- $t"; dig +noall +answer +authority $t $H @1.1.1.1; done
            echo "-- dnssec 8.8.8.8"; dig +dnssec +noall +answer +comments A $H @8.8.8.8 | grep -E "flags|status|RRSIG|IN A"
            echo "-- authoritative"; ns=$(dig +short NS dncr.me @1.1.1.1 | head -1); echo "ns=$ns"; dig +noall +answer A $H @$ns; dig +noall +answer AAAA $H @$ns
          done
          echo "-- any explicit records under valet.dncr.me? (zone NSEC walk not possible on CF; try a few)"
          for H in valet.dncr.me x.valet.dncr.me; do dig +noall +answer A $H @1.1.1.1; done
