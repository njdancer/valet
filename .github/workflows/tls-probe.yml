name: tls probe
on:
  push:
    branches: [claude/tls-probe]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: probe
        run: |
          set +e
          H=34d3475801fae38f59e75ff4.valet.dncr.me
          pip install -q httpx >/dev/null 2>&1
          python3 - <<'PY'
          import httpx, socket, ssl, threading, time
          H="34d3475801fae38f59e75ff4.valet.dncr.me"
          body={"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"p","version":"1"}}}
          # capture what httpx writes, per send call
          ls=socket.socket(); ls.bind(("127.0.0.1",0)); ls.listen(1); port=ls.getsockname()[1]
          chunks=[]
          def srv():
            c,_=ls.accept(); c.settimeout(1)
            try:
              while True:
                d=c.recv(65536)
                if not d: break
                chunks.append(d)
            except Exception: pass
            c.sendall(b"HTTP/1.1 200 OK\r\ncontent-length: 0\r\n\r\n"); c.close()
          threading.Thread(target=srv,daemon=True).start()
          try: httpx.post(f"http://127.0.0.1:{port}/mcp", json=body, timeout=5)
          except Exception as e: print("cap err", e)
          time.sleep(0.5)
          print("CAPTURED", [bytes(x) for x in chunks])
          cap=b"".join(chunks).replace(f"127.0.0.1:{port}".encode(), H.encode())
          headpart, bodypart = cap.split(b"\r\n\r\n",1)
          headpart+=b"\r\n\r\n"
          def raw(label, pieces, gap=0.05):
            ctx=ssl.create_default_context(); ctx.set_alpn_protocols(["http/1.1"])
            s=ctx.wrap_socket(socket.create_connection((H,443),timeout=10), server_hostname=H)
            for i,p in enumerate(pieces):
              if i: time.sleep(gap)
              s.sendall(p)
            out=b""
            try:
              while True:
                d=s.recv(65536)
                if not d: break
                out+=d
            except Exception as e: out+=f"<{e}>".encode()
            print(label, repr(out[:90]))
          raw("httpx bytes one write", [cap])
          raw("httpx bytes split", [headpart, bodypart])
          raw("httpx bytes split nogap", [headpart, bodypart], 0)
          hp=headpart.replace(b"Accept-Encoding: gzip, deflate\r\n",b"")
          raw("split no accept-encoding", [hp, bodypart])
          hp2=headpart.replace(b"Connection: keep-alive\r\n",b"")
          raw("split no keepalive", [hp2, bodypart])
          raw("headers only then wait", [headpart], 0)
          PY
