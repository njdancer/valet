name: Site probe

# A one-off, paced look at candidate practice sites (spikes/03-practice-sites/probe.mjs). Runs on
# pushes to this thread's branch only, and is removed before the branch is merged.

on:
  push:
    branches: [claude/project-thread-txmiu2]
    paths: [spikes/03-practice-sites/**, .github/workflows/site-probe.yml]

permissions:
  contents: write

jobs:
  probe:
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - run: sh spikes/03-practice-sites/probe.sh "$RUNNER_TEMP/out/captures" | tee "$RUNNER_TEMP/probe.txt"
      - name: push the output to a branch (a cloud session can't read Actions logs)
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/out" && cp "$RUNNER_TEMP"/probe.txt "$RUNNER_TEMP/out/" 2>/dev/null || true
          cp -R "$RUNNER_TEMP"/shots "$RUNNER_TEMP/out/" 2>/dev/null || true
          cd "$RUNNER_TEMP/out" && git init -q -b probe && git add -A
          git -c user.name=site-probe -c user.email=site-probe@users.noreply.github.com commit -qm "Site probe ${{ github.run_id }}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" HEAD:refs/heads/site-probes/${{ github.run_id }}
