name: Deploy blind relay

# Deploys the blind relay (apps/blind-relay, docs/blind-relay.md) to Fly after CI passes on main,
# so a merge is a deploy (Nick, 2026-11-18, for the hub; the same here). The gate: the commit's own
# CI run passed, including check (ubuntu-latest), which runs the relay's end-to-end tests and its
# certificate test against Pebble; the commit is still main's tip; and it changed something the
# relay runs. Needs the FLY_API_TOKEN secret (a deploy token for the valet-relay app); without it
# the job says so and stops. With CLOUDFLARE_DNS_TOKEN (Zone › DNS › Edit on dncr.me) it also points
# the relay's names at its dedicated Fly addresses after each run (apps/blind-relay/scripts/
# sync-dns.mjs). That token lives here, never on the relay. GitHub's runners have no IPv6, so the
# version live is read through flyctl, not from /healthz.

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      force:
        description: Deploy main's tip even if nothing the relay runs changed
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

concurrency:
  group: deploy-relay
  cancel-in-progress: false

env:
  RELAY_URL: https://relay.valet.dncr.me
  FLY_APP: valet-relay
  DNS_ZONE: dncr.me
  DNS_NAMES: relay.valet.dncr.me *.valet.dncr.me
  # flyctl's version. Bump by hand after reading its changelog.
  FLYCTL_VERSION: 0.3.209

jobs:
  deploy:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: which commit, and should it deploy
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          RUN_SHA: ${{ github.event.workflow_run.head_sha }}
          FORCE: ${{ inputs.force }}
          REPO: ${{ github.repository }}
          HAS_TOKEN: ${{ secrets.FLY_API_TOKEN != '' }}
        run: |
          if [ "$HAS_TOKEN" != true ]; then
            echo "::notice::FLY_API_TOKEN is not set: the blind relay isn't deployed"
            echo "deploy=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          tip=$(gh api "repos/$REPO/commits/main" -q .sha)
          if [ "$EVENT" = workflow_dispatch ]; then
            sha="$tip"
            RUN_ID=$(gh api "repos/$REPO/actions/workflows/ci.yml/runs?head_sha=$sha&event=push&status=success" -q '.workflow_runs[0].id // empty')
            [ -n "$RUN_ID" ] || { echo "no successful CI run on main's tip $sha yet"; exit 1; }
          else
            sha="$RUN_SHA"
            if [ "$sha" != "$tip" ]; then
              echo "$sha is no longer main's tip ($tip): that commit's own run deploys"
              echo "deploy=false" >> "$GITHUB_OUTPUT"; exit 0
            fi
          fi
          check=$(gh api "repos/$REPO/actions/runs/$RUN_ID/jobs?per_page=100" -q '.jobs[] | select(.name == "check (ubuntu-latest)") | .conclusion')
          if [ "$check" != success ]; then
            echo "check (ubuntu-latest) on $sha: ${check:-not run}; not deploying"
            echo "deploy=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "deploy=true" >> "$GITHUB_OUTPUT"

      - if: steps.gate.outputs.deploy == 'true'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ steps.gate.outputs.sha }}
          fetch-depth: 0

      - name: flyctl
        if: steps.gate.outputs.deploy == 'true'
        run: |
          set -euo pipefail
          base="https://github.com/superfly/flyctl/releases/download/v$FLYCTL_VERSION"
          file="flyctl_${FLYCTL_VERSION}_Linux_x86_64.tar.gz"
          cd "$RUNNER_TEMP"
          curl -fsSL -o "$file" "$base/$file"
          curl -fsSL -o checksums.txt "$base/checksums.txt"
          grep " $file\$" checksums.txt | sha256sum -c
          tar xzf "$file" flyctl
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: the version live now
        if: steps.gate.outputs.deploy == 'true'
        id: live
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          live=$(flyctl machine list -a "$FLY_APP" --json 2>/dev/null | jq -r '[.[] | select(.state == "started") | .config.env.RELAY_VERSION // empty][0] // empty' || true)
          echo "live: ${live:-none}"
          echo "live=$live" >> "$GITHUB_OUTPUT"

      - name: did anything the relay runs change since the live version
        if: steps.gate.outputs.deploy == 'true'
        id: changed
        env:
          LIVE: ${{ steps.live.outputs.live }}
          SHA: ${{ steps.gate.outputs.sha }}
          FORCE: ${{ inputs.force }}
        run: |
          if [ "$FORCE" = true ] || [ -z "$LIVE" ] || ! git cat-file -e "$LIVE^{commit}" 2>/dev/null; then
            echo "run=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if git diff --quiet "$LIVE" "$SHA" -- apps/blind-relay packages/core packages/acme pnpm-lock.yaml .github/workflows/deploy-relay.yml; then
            echo "nothing the relay runs changed since $LIVE"
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.changed.outputs.run == 'true'
        uses: jdx/mise-action@c37c93293d6b742fc901e1406b8f764f6fb19dac # v2.4.4
        env:
          MISE_DISABLE_TOOLS: xcodegen

      - name: build
        if: steps.changed.outputs.run == 'true'
        run: |
          pnpm install --frozen-lockfile
          node apps/blind-relay/scripts/build.mjs
          mkdir -p "$RUNNER_TEMP/relay"
          cp apps/blind-relay/dist/main.js apps/blind-relay/Dockerfile apps/blind-relay/fly.toml "$RUNNER_TEMP/relay/"

      - name: deploy
        if: steps.changed.outputs.run == 'true'
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          SHA: ${{ steps.gate.outputs.sha }}
        working-directory: ${{ runner.temp }}/relay
        run: flyctl deploy --remote-only --env "RELAY_VERSION=$SHA" --wait-timeout 300

      - name: point the relay's names at its addresses
        if: steps.gate.outputs.deploy == 'true'
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          CLOUDFLARE_DNS_TOKEN: ${{ secrets.CLOUDFLARE_DNS_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_DNS_TOKEN" ]; then
            echo "::notice::CLOUDFLARE_DNS_TOKEN is not set: DNS for the relay is left as it is"; exit 0
          fi
          flyctl ips list -a "$FLY_APP" --json > "$RUNNER_TEMP/ips.json"
          # shellcheck disable=SC2086 # DNS_NAMES is a list of names, word-split on purpose
          node apps/blind-relay/scripts/sync-dns.mjs "$DNS_ZONE" $DNS_NAMES < "$RUNNER_TEMP/ips.json"

      - name: the new version runs
        if: steps.changed.outputs.run == 'true'
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          SHA: ${{ steps.gate.outputs.sha }}
        run: |
          for i in $(seq 1 30); do
            live=$(flyctl machine list -a "$FLY_APP" --json | jq -r '[.[] | select(.state == "started") | .config.env.RELAY_VERSION // empty][0] // empty' || true)
            [ "$live" = "$SHA" ] && break
            sleep 10
          done
          [ "$live" = "$SHA" ] || { echo "the relay isn't running $SHA (last: ${live:-nothing})"; exit 1; }
          echo "running: $live"
          # Over IPv4 when the relay has a dedicated one; the runners can't reach IPv6.
          if flyctl ips list -a "$FLY_APP" --json | jq -e 'any(.[]; .Type == "v4")' > /dev/null; then
            for i in $(seq 1 30); do
              answer=$(curl -4 -fsS --max-time 10 "$RELAY_URL/healthz" | awk '{print $2}' || true)
              [ "$answer" = "$SHA" ] && { echo "/healthz: $answer"; exit 0; }
              sleep 10
            done
            echo "/healthz didn't answer with $SHA (last: ${answer:-nothing})"; exit 1
          fi
          echo "::notice::No dedicated IPv4, so /healthz wasn't checked from here."
