name: node-runtime-dev
# Temporary, while the Node runtime's profile is tuned on macOS: removed before the PR merges.
on:
  push:
    branches: [claude/project-thread-gohq3y]
permissions:
  contents: read
jobs:
  probe:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: jdx/mise-action@c37c93293d6b742fc901e1406b8f764f6fb19dac # v2.4.4
      - run: pnpm install --frozen-lockfile
      - run: sw_vers; node --version
      - name: profile probe
        run: pnpm exec tsx packages/node-runtime/test/probe-profile.ts || true
      - name: profile probe denials
        run: |
          sleep 2
          log show --last 3m --style compact --predicate 'eventMessage CONTAINS "Sandbox:"' | sed -E 's/^[0-9: .-]+//; s/\([0-9]+\)//' | sort | uniq -c | sort -rn | head -150 || true
          log show --last 3m --style compact --predicate 'process == "node" OR process == "ReportCrash"' | grep -iE "abort|crash|assert|fatal" | head -40 || true
          for f in ~/Library/Logs/DiagnosticReports/node*.ips; do [ -f "$f" ] && head -c 15000 "$f"; echo; break; done || true
      - name: node-runtime tests
        run: |
          pnpm exec vitest run --project node-runtime 2>&1 | tee "$RUNNER_TEMP/out.txt"; exit "${PIPESTATUS[0]}"
      - name: sandbox denials
        if: always()
        run: |
          log show --last 10m --style compact --predicate 'eventMessage CONTAINS "node(" OR eventMessage CONTAINS "sandbox-exec("' | grep -i "deny" | sed -E 's/^[0-9: .-]+//' | sort | uniq -c | sort -rn | head -150
