# Adds Nick's Mac as a Claude.ai connector would (at its other name, tunnelAlias(macId, '2'):
# claude.ai won't dial any name containing its macId since 2026-11-22), from the public internet, as far as it can go
# without a person (.github/scripts/connector-check.mjs). On demand only: Nick asked on 2026-11-23
# that it stop running on a schedule or after deploys (it was for debugging the integration), and
# it registers no client unless asked. A red run means a connector added now would fail.
name: connector check

on:
  workflow_dispatch:
    inputs:
      mac_host:
        description: The Mac's name on the relay
        default: 34d3475801fae38f59e75ff4.valet.dncr.me
      rounds:
        description: Rounds of discovery
        default: "10"
      register:
        description: Also register a client (it shows on the phone until it expires within the hour)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: connector-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      MAC_HOST: ${{ inputs.mac_host || '34d3475801fae38f59e75ff4.valet.dncr.me' }}
      ROUNDS: ${{ inputs.rounds || '5' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          sparse-checkout: .github/scripts
      - name: DNS from two public resolvers
        run: |
          set -u
          [[ "$MAC_HOST" =~ ^([0-9a-f]{32}|[0-9a-f]{24})\.valet\.dncr\.me$ ]] || { echo "not a Mac name"; exit 1; }
          bad=0
          for r in 1.1.1.1 8.8.8.8; do
            a=$(dig +short A "$MAC_HOST" @"$r" | sort | tr '\n' ' ')
            aaaa=$(dig +short AAAA "$MAC_HOST" @"$r" | sort | tr '\n' ' ')
            echo "$r A: $a AAAA: $aaaa"
            # The relay's dedicated IPv4 only: Claude's connectors are IPv4-only, and any other
            # address (a proxied record, an old tunnel) would answer for some callers and not others.
            [ "$a" = "149.248.210.244 " ] || bad=1
          done
          [ "$bad" -eq 0 ] || { echo "::error::DNS for $MAC_HOST is not just the relay's IPv4"; exit 1; }
      - name: Add the connector the way Claude does
        run: |
          flag=""
          [ "${{ inputs.register }}" = "true" ] && flag="--register"
          node .github/scripts/connector-check.mjs "$MAC_HOST" "$ROUNDS" $flag
