name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    # macOS, because the updater tests use ditto and the app only ships for macOS.
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
      - run: pnpm install --frozen-lockfile
      - run: pnpm check

  e2e:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
      - run: pnpm install --frozen-lockfile
      - name: browser-electron end to end
        run: |
          pnpm --filter @valet/browser-electron typecheck:e2e
          pnpm --filter @valet/browser-electron test:e2e --trace off
      - name: desktop end to end
        run: pnpm --filter @valet/desktop test:e2e --trace off

  swift-bridge:
    # The stdio bridge the packaged app ships (D60), built and run against the same suite as the
    # TypeScript bridge (packages/mcp-server/test/bridge-contract.ts).
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
      - run: pnpm install --frozen-lockfile
      # Universal, as the packaged app ships it (electron-builder.config.ts, SWIFT_BRIDGE_BUILD).
      - run: swift build -c release --arch arm64 --arch x86_64 --package-path swift-bridge
      - name: shared bridge suite against the Swift bridge
        run: pnpm exec vitest run --project mcp-server test/bridge-contract
        env:
          VALET_SWIFT_BRIDGE: ${{ github.workspace }}/swift-bridge/.build/apple/Products/Release/valet-bridge

  release-dry-run:
    # AC18's one release command end to end, with nothing real in reach: an ad hoc signature, a
    # throwaway Ed25519 feed key made in the job, and notarisation, upload and tag as printed stubs
    # (apps/desktop/scripts/release.mjs). pnpm check runs in the check job, so it is skipped here.
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
      - run: pnpm install --frozen-lockfile
      - name: release dry run
        run: pnpm release "$(node -p "require('./apps/desktop/package.json').version")" --dry-run --skip-check
      # The summary and the signed feed metadata only (the key it was signed with is gone); the
      # dry-run DMG and zips are not kept.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-dry-run
          path: |
            apps/desktop/dist/release-*/release-summary.json
            apps/desktop/dist/release-*/publish/*-mac.yml
            apps/desktop/dist/release-*/publish/*-mac.envelope.json*
          if-no-files-found: ignore
          retention-days: 7
