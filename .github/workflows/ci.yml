name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    # macOS, because the updater tests use ditto and the app only ships for macOS.
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
      - run: pnpm install --frozen-lockfile
      - run: pnpm check

  e2e:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
      - run: pnpm install --frozen-lockfile
      - name: browser-electron end to end
        run: |
          pnpm --filter @valet/browser-electron typecheck:e2e
          pnpm --filter @valet/browser-electron test:e2e --trace off
      - name: desktop end to end
        run: pnpm --filter @valet/desktop test:e2e --trace off
      - name: drift smoke test, dry run against the fake (the live run skips without VALET_LIVE_SMOKE)
        run: |
          pnpm --filter @valet/adapter-woolworths typecheck:smoke
          pnpm --filter @valet/adapter-woolworths test:smoke --trace off

  swift-bridge:
    # The native binaries the packaged app ships: the stdio bridge (D60), run against the same suite
    # as the TypeScript bridge (packages/mcp-server/test/bridge-contract.ts), and the Keychain and
    # Messages helpers (D6, D8), run against the TypeScript contract suites in packages/credentials.
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
      - run: pnpm install --frozen-lockfile
      # Universal, as the packaged app ships it (electron-builder.config.ts, SWIFT_BRIDGE_BUILD).
      - run: swift build -c release --arch arm64 --arch x86_64 --package-path swift-bridge
      - name: shared bridge suite against the Swift bridge
        run: pnpm exec vitest run --project mcp-server test/bridge-contract
        env:
          VALET_SWIFT_BRIDGE: ${{ github.workspace }}/swift-bridge/.build/apple/Products/Release/valet-bridge
      - run: swift test --package-path swift-bridge
      # Debug, where the helpers take a throwaway keychain file and a fixture Messages database.
      - run: swift build --package-path swift-bridge
      - name: helper contract suites
        run: pnpm exec vitest run --project credentials test/keychain-contract test/otp-contract
        env:
          VALET_SWIFT_KEYCHAIN: ${{ github.workspace }}/swift-bridge/.build/debug/valet-keychain
          VALET_SWIFT_MESSAGES_HELPER: ${{ github.workspace }}/swift-bridge/.build/debug/valet-messages-helper
